plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gauravkharva.faceswapstudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gauravkharva.faceswapstudio'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
