name: Build Portrait Studio V2 Fixed Windows EXE
on:
  push:
    branches:
      - portrait-studio-windows-exe-build
    paths:
      - 'windows-portrait/source-v2.b64'
      - '.github/workflows/portrait-studio-windows-v2.yml'
  workflow_dispatch:
jobs:
  build-windows-fixed:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unpack fixed-source archive
        shell: pwsh
        run: |
          $b64 = (Get-Content 'windows-portrait/source-v2.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('v2_source.zip', [Convert]::FromBase64String($b64))
          Expand-Archive 'v2_source.zip' -DestinationPath 'v2' -Force
      - name: Install desktop requirements
        working-directory: v2
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt pyinstaller
      - name: Run nine regression tests
        working-directory: v2
        run: python -m unittest discover -s tests -v
      - name: Build Windows EXE
        working-directory: v2
        run: python -m PyInstaller --clean --onefile --windowed --noconfirm --name PortraitStudio-Fixed app.py
      - name: Prepare repair-capable distribution
        working-directory: v2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'package','package/scripts','package/models','package/outputs' | Out-Null
          Copy-Item 'dist/PortraitStudio-Fixed.exe' 'package/PortraitStudio-Fixed.exe'
          Copy-Item 'generator_worker.py','safety.py','requirements-ai.txt','README.md' 'package/'
          Copy-Item 'scripts/repair_ai_cpu_windows.bat','scripts/setup_ai_windows.bat','scripts/download_model.py' 'package/scripts/'
          New-Item -ItemType File -Force -Path 'package/models/.keep','package/outputs/.keep' | Out-Null
          if (!(Test-Path 'package/PortraitStudio-Fixed.exe')) { throw "EXE missing" }
      - name: Upload V2 fixed Windows application
        uses: actions/upload-artifact@v4
        with:
          name: PortraitStudio-Fixed-Windows-V2
          path: v2/package/
          if-no-files-found: error
          retention-days: 30
