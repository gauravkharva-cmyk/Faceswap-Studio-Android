name: Build GK Qwen Image 2.1 APK
on:
  push:
    branches:
      - feature/gk-qwen-image-21-android
    paths:
      - 'qwen-studio/**'
      - '.github/workflows/gk-qwen-image-21-apk.yml'
  pull_request:
    paths:
      - 'qwen-studio/**'
      - '.github/workflows/gk-qwen-image-21-apk.yml'
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug-signed APK
        run: gradle --no-daemon --stacktrace -p qwen-studio :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GK-Qwen-Image-2.1-Studio-APK
          path: qwen-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
