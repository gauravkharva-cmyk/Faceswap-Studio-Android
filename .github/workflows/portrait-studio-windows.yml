name: Build Portrait Studio Windows EXE
on:
  push:
    branches:
      - portrait-studio-windows-exe-build
    paths:
      - 'windows-portrait/**'
      - '.github/workflows/portrait-studio-windows.yml'
jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unpack original Portrait Studio source
        shell: pwsh
        run: |
          $encoded = (Get-Content 'windows-portrait/source.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('portrait_source.zip', [Convert]::FromBase64String($encoded))
          Expand-Archive 'portrait_source.zip' -DestinationPath 'portrait' -Force
      - name: Install build requirements
        working-directory: portrait
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt pyinstaller
      - name: Run app tests
        working-directory: portrait
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        working-directory: portrait
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PortraitStudio app.py
      - name: Include optional offline AI installation files
        working-directory: portrait
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'package','package/scripts','package/models','package/outputs' | Out-Null
          Copy-Item 'dist/PortraitStudio.exe' 'package/PortraitStudio.exe'
          Copy-Item 'generator_worker.py','safety.py','requirements-ai.txt','README.md' 'package/'
          Copy-Item 'scripts/download_model.py','scripts/setup_ai_windows.bat' 'package/scripts/'
          New-Item -ItemType File -Force -Path 'package/models/.keep','package/outputs/.keep' | Out-Null
      - name: Upload installable Windows application ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PortraitStudio-Windows-EXE
          path: portrait/package/
          if-no-files-found: error
          retention-days: 30
