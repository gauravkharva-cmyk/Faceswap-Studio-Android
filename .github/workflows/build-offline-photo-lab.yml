name: Build Offline Photo Lab APK
on:
  push:
    branches: [offline-photo-lab]
    paths:
      - 'offline-photo-lab-source.b64'
      - '.github/workflows/build-offline-photo-lab.yml'
  pull_request:
    branches: [main]
    paths:
      - 'offline-photo-lab-source.b64'
      - '.github/workflows/build-offline-photo-lab.yml'
  workflow_dispatch:

jobs:
  offline-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Unpack complete offline Android app
        run: |
          set -euo pipefail
          base64 --decode offline-photo-lab-source.b64 > offline-photo-lab-source.tar.gz
          tar -xzf offline-photo-lab-source.tar.gz
          test -f OfflinePhotoLab/settings.gradle
          test -f OfflinePhotoLab/app/src/main/java/com/openphotolab/MainActivity.java
          test -f OfflinePhotoLab/app/src/main/java/com/openphotolab/ProceduralGenerator.java
          if grep -Eq '<uses-permission[^>]*INTERNET' OfflinePhotoLab/app/src/main/AndroidManifest.xml; then
            echo 'Unexpected INTERNET permission' >&2
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use installed Android SDK
        shell: bash
        run: |
          set -eux
          test -d "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble installable APK
        run: gradle --no-daemon --project-dir OfflinePhotoLab :app:assembleDebug
      - name: Verify APK excludes network permission
        shell: bash
        run: |
          APK=OfflinePhotoLab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee apk-permissions.txt
          if grep -Eq 'android.permission.INTERNET' apk-permissions.txt; then
            echo "Error: offline APK contains INTERNET permission" >&2
            exit 1
          fi
      - name: Upload offline APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePhotoLab-APK
          path: OfflinePhotoLab/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
