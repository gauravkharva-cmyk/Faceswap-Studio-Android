name: Import Full Android FaceFusion Architecture

on:
  push:
    paths:
      - '.github/workflows/import-facefusion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout FaceSwap Studio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Vendor complete Android FaceFusion implementation
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Parasaran-Python/android-face-fusion.git /tmp/android-face-fusion
          git -C /tmp/android-face-fusion checkout aafb3c3638529a61ba94fe8de579097fbcfb6885
          mkdir -p facefusion-android
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/android-face-fusion/ facefusion-android/
          python3 scripts/patch_facefusion.py
          test -f facefusion-android/LICENSE
          test -f facefusion-android/app/src/main/assets/emap.bin

      - name: Save full architecture to this repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add facefusion-android
          if ! git diff --cached --quiet; then
            git commit -m "Vendor MIT Android FaceFusion neural architecture (v2)"
            git push origin HEAD:main
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android API 37 and NDK 28
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Missing sdkmanager"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Compile neural FaceSwap Studio APK
        working-directory: facefusion-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload v2 installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwap-Studio-AI-v2-APK
          path: facefusion-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
