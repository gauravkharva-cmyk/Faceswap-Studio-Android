name: Publish FaceSwap Studio AI v2 APK

on:
  push:
    paths:
      - '.github/workflows/publish-facefusion-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2.0-facefusion
      SOURCE_RUN_ID: "39181012128"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download successful v2 build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "FaceSwap-Studio-AI-v2-APK" \
            --dir output
          ls -lah output
          test -s output/app-debug.apk
          mv output/app-debug.apk output/FaceSwap-Studio-AI-v2.apk

      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq output/FaceSwap-Studio-AI-v2.apk >/dev/null
          unzip -Z1 output/FaceSwap-Studio-AI-v2.apk | grep -Fx 'AndroidManifest.xml'
          unzip -Z1 output/FaceSwap-Studio-AI-v2.apk | grep -Fx 'classes.dex'
          sha256sum output/FaceSwap-Studio-AI-v2.apk

      - name: Publish permanent GitHub Release download
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              output/FaceSwap-Studio-AI-v2.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" \
              output/FaceSwap-Studio-AI-v2.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target 85864fd14bb8ec8e7bf90a977e98d007ec663f4c \
              --title "FaceSwap Studio AI v2 - Neural Face Swapping" \
              --notes "Android FaceFusion-based photo face swap APK. The source is the MIT-licensed AndroidFaceFusion port (attribution preserved); neural models download on first launch (~739 MB) and have separate non-commercial research licensing. FaceSwap Studio adaptation includes consent confirmation and an AI EDITED watermark for exported images. Built from successful GitHub Actions run 39181012128. Use only with appropriate consent."
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
