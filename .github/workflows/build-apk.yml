name: Build AI Web Access APK
on:
  push:
    branches: [stuffer-web-access]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Web-Access-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=stuffer-web-access-v1.0.0
          FILE=app/build/outputs/apk/debug/app-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE#AI-Web-Access-for-Stuffer.apk" --clobber
          else
            gh release create "$TAG" "$FILE#AI-Web-Access-for-Stuffer.apk" --title "AI Web Access for Stuffer v1.0.0" --notes "Independent, unofficial Android WebView wrapper for https://stuffer.ai/. Requires internet access. Debug-signed build for personal installation." --target "$GITHUB_SHA" --latest=false
          fi
