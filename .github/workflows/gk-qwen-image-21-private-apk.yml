name: Build GK Qwen Private Android APK
on:
  push:
    branches:
      - feature/gk-qwen-image-21-private
    paths:
      - 'private-studio/**'
      - '.github/workflows/gk-qwen-image-21-private-apk.yml'
  pull_request:
    paths:
      - 'private-studio/**'
      - '.github/workflows/gk-qwen-image-21-private-apk.yml'
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build private debug-signed APK
        run: gradle --no-daemon --stacktrace -p private-studio :app:assembleDebug
      - name: Upload private APK
        uses: actions/upload-artifact@v4
        with:
          name: GK-Qwen-Image-2.1-Private-APK
          path: private-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
